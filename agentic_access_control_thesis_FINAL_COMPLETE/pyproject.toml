[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-access-control-thesis"
version = "0.1.0"
description = "Controlled evaluation of post-detection autonomy for access-control enforcement"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
openai = ["openai>=1.0"]

[project.scripts]
ace = "access_control_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
